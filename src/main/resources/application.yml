# Application configuration for the Product Management API.
#
# Everything here is an in-memory, throwaway setup: the H2 database lives only as
# long as the JVM runs, and the schema is rebuilt from the JPA entities on every
# start. That is deliberate for a learning project — there is no migration tool,
# no external database, and nothing to clean up between runs.

spring:
  application:
    name: product-management

  # H2 in-memory store. The `mem:` URL means the database is held in memory and
  # discarded at shutdown, so every boot starts from an empty schema.
  datasource:
    url: jdbc:h2:mem:appdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    # Rebuild the schema from the @Entity classes on every start.
    #
    # `create-drop` suits an in-memory practice database: it drops the schema on
    # shutdown and recreates it on the next boot, so a schema change is picked up
    # immediately and no stale rows survive a restart. The trade-off is that it
    # discards data on shutdown — do not use it against anything you care about.
    #
    # The production-safe alternatives are `validate` (fail fast on a mismatched
    # schema, change nothing) and `update` (mutate the existing schema). Neither
    # belongs in a throwaway demo store.
    hibernate:
      ddl-auto: create-drop

    # Fail at the boundary rather than serialising a lazy collection later.
    #
    # With this false, Hibernate closes the session before the controller
    # serialises the response. That is what forces DTO mapping inside a
    # transaction instead of accidentally relying on a session that is still
    # open — the usual cause of `LazyInitializationException` and of N+1 queries.
    open-in-view: false

    # Run data.sql only after Hibernate has created the schema.
    #
    # Without this, Spring's SQL initialiser runs before Hibernate has created
    # any tables, and the inserts fail because the `product` table does not exist
    # yet. The `defer-` flag sequences initialisation after `ddl-auto`.
    defer-datasource-initialization: true

    properties:
      hibernate:
        # Log generated SQL to stdout. Purely a learning aid — invaluable for
        # seeing what your repository methods actually do, noise in production.
        format_sql: true

  # Runs src/main/resources/data.sql on startup.
  sql:
    init:
      # Currently `never`, because data.sql inserts into `product` and the Product
      # entity is still a placeholder with no @Entity annotation — Hibernate creates
      # no table, so the script fails and aborts startup. Switch to `embedded` in the
      # same change that implements Product.
      mode: never

  h2:
    console:
      # Browser-based SQL shell at http://localhost:8080/h2-console.
      # Connect with JDBC URL `jdbc:h2:mem:appdb`, user `sa`, blank password.
      enabled: true
      path: /h2-console

# Springdoc serves the Swagger UI and the OpenAPI JSON it reads.
# The document's contents (paths, schemas) are generated by introspecting the
# controllers at startup; only these paths are configured here. Document metadata
# comes from the OpenAPI bean in config/OpenApiConfig.java.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs